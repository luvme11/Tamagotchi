/* Layout: a toy-shop poster. Left column = the colorway's name, copy, mini-egg swatches and an LCD care log; right = the egg on a spotlight with an outlined TAMA wordmark behind it, and chunky A/B/C keys underneath. The whole page takes its tint from the selected egg. */

  transition: --tone 0.6s ease, --bc 0.6s ease;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15131f; --ink: #ece9f8; --mute: #a09db6; --line: rgba(236, 233, 248, 0.22); --grid: rgba(236, 233, 248, 0.045);
    --mix: 30%; --spot: color-mix(in srgb, var(--tone) 46%, #0c0b14); --ground: rgba(0, 0, 0, 0.6); --chip-ring: rgba(236, 233, 248, 0.35);
    --focus: #9db8ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15131f; --ink: #ece9f8; --mute: #a09db6; --line: rgba(236, 233, 248, 0.22); --grid: rgba(236, 233, 248, 0.045);
  --mix: 30%; --spot: color-mix(in srgb, var(--tone) 46%, #0c0b14); --ground: rgba(0, 0, 0, 0.6); --chip-ring: rgba(236, 233, 248, 0.35);
  --focus: #9db8ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: color-mix(in srgb, var(--tone) var(--mix), var(--paper));
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 36px;
  min-height: 100svh;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.page {
  max-width: 1280px; margin: 0 auto;
  display: grid; gap: 14px clamp(24px, 4vw, 64px); align-items: center;
  grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
  grid-template-areas: "top top" "intro scene" "lcd scene" ". dock";
}

/* top bar */
.top { grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 14px; letter-spacing: 0.22em; }
.brand span { color: var(--mute); letter-spacing: 0.14em; font-size: 11px; }
.mark { width: 12px; height: 16px; background: var(--ink); border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; flex: none; }
.pill {
  cursor: pointer; background: transparent; border: 2px solid var(--ink); border-radius: 999px;
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  padding: 0.55em 1.2em; display: inline-flex; align-items: center; gap: 0.8em; font-family: var(--font-mono);
}
.pill:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.pill .dot { width: 0.75em; height: 0.75em; border-radius: 50%; background: var(--ink); }
.pill[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--mute); }

/* intro */
.intro { grid-area: intro; align-self: end; min-width: 0; }
.count { margin: 0; font-size: 13px; color: var(--mute); display: flex; align-items: baseline; gap: 8px; }
.count b { font-weight: 400; font-size: 30px; color: var(--ink); letter-spacing: 0.04em; }
.vname {
  margin: 6px 0 0; font-family: var(--font-display); font-weight: 400; text-transform: uppercase;
  font-size: clamp(48px, 6.2vw, 96px); line-height: 0.95; letter-spacing: 0.01em; overflow-wrap: anywhere; text-wrap: balance;
}
.vsub { margin: 12px 0 0; font-size: 15px; font-weight: 500; }
.vdesc { margin: 6px 0 0; max-width: 34ch; color: var(--mute); }
.chips { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 16px; padding-top: 6px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.intro.swap .vname, .intro.swap .vsub, .intro.swap .vdesc { animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.intro.swap .vsub { animation-delay: 0.06s; }
.intro.swap .vdesc { animation-delay: 0.12s; }

/* mini-egg swatches */
.chip {
  position: relative; width: 42px; height: 54px; padding: 0; border: 0; cursor: pointer; background: var(--c);
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  box-shadow: inset -5px -7px 0 rgba(0, 0, 0, 0.16), inset 3px 4px 0 rgba(255, 255, 255, 0.28), 0 0 0 1.5px var(--chip-ring);
  transition: transform 0.2s, box-shadow 0.2s;
}
.chip i { position: absolute; left: 50%; top: 14%; width: 18px; height: 16px; margin-left: -9px; background: var(--lcd); border-radius: 3px; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.55); }
.chip::after { content: ""; position: absolute; left: 50%; bottom: 13%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--b); box-shadow: -11px -2px 0 var(--b), 11px -2px 0 var(--b); }
.chip:hover { transform: translateY(-3px); }
.chip[aria-checked="true"] {
  transform: translateY(-5px) scale(1.08);
  box-shadow: inset -5px -7px 0 rgba(0, 0, 0, 0.16), inset 3px 4px 0 rgba(255, 255, 255, 0.28), 0 0 0 3px var(--paper), 0 0 0 5px var(--ink);
}

/* scene */
.scene { grid-area: scene; position: relative; height: clamp(520px, 76svh, 780px); min-width: 0; }
.scene::before {
  content: ""; position: absolute; left: 50%; top: 46%; width: min(92%, 600px); aspect-ratio: 1; max-width: 100%; transform: translate(-50%, -50%);
  border-radius: 50%; background: radial-gradient(closest-side, var(--spot), transparent 72%); pointer-events: none;
}
.wordmark {
  position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); margin: 0; white-space: pre; text-align: center;
  font-family: var(--font-mono); font-size: clamp(96px, 16vw, 240px); line-height: 0.82; letter-spacing: -0.02em;
  color: color-mix(in srgb, var(--tone) 20%, transparent); -webkit-text-stroke: 2px color-mix(in srgb, var(--tone) 60%, var(--paper));
  pointer-events: none; user-select: none;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; z-index: 2; }
#gl.grab { cursor: grabbing; }
.ground {
  position: absolute; left: 50%; bottom: 6%; width: 34%; height: 3.4%; transform: translateX(-50%) scale(var(--gs, 1));
  background: radial-gradient(closest-side, var(--ground), transparent); pointer-events: none; z-index: 1;
}
.hint { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); font-size: 10px; color: var(--mute); transition: opacity 0.6s; white-space: nowrap; pointer-events: none; z-index: 3; }
.hint.off { opacity: 0; }
.fallback { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--mute); }

/* LCD care log */
.lcdbox {
  grid-area: lcd; align-self: start; width: 100%; max-width: 400px; background: #d6d9e1; padding: 10px; border-radius: 22px;
  box-shadow: 0 12px 28px rgba(20, 18, 40, 0.22), inset 0 0 0 2px rgba(255, 255, 255, 0.75);
}
.screen {
  color: var(--lcd-ink); background-color: var(--lcd); border-radius: 12px; padding: 12px 16px 12px;
  background-image: linear-gradient(to right, var(--lcd-ghost) 1px, transparent 1px), linear-gradient(to bottom, var(--lcd-ghost) 1px, transparent 1px);
  background-size: 6px 6px; box-shadow: inset 0 0 0 2px #3b3f4d;
}
.lhead, .lfoot { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; }
.lhead { padding-bottom: 6px; border-bottom: 2px solid var(--lcd-ink); }
.lfoot { padding-top: 7px; border-top: 2px solid var(--lcd-ink); }
.lhead b, .lfoot b { font-weight: 400; font-variant-numeric: tabular-nums; }
.meter { display: grid; grid-template-columns: 3.4em 1fr auto; align-items: center; gap: 10px; padding: 7px 0; }
.meter + .meter { border-top: 2px dotted var(--lcd-ghost); }
.meter span:first-child { font-size: 13px; font-weight: 500; }
.hearts { display: flex; gap: 6px; }
.hearts svg { width: 21px; height: 18px; display: block; shape-rendering: crispEdges; }
.hearts .on { fill: var(--lcd-ink); }
.hearts .off { fill: var(--lcd-ghost); }
.meter output { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }

/* keys */
.dock { grid-area: dock; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.keys { display: flex; gap: clamp(20px, 4vw, 34px); justify-content: center; }
.kbtn { display: flex; flex-direction: column; align-items: center; gap: 12px; background: none; border: 0; padding: 0; cursor: pointer; }
.kbtn:focus-visible { outline: none; }
.kbtn:focus-visible .cap { outline: 3px solid var(--focus); outline-offset: 4px; }
.kbtn .cap {
  width: 58px; height: 58px; border-radius: 50%; background: var(--bc); color: var(--bt); display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 22px; line-height: 1;
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.18), 0 5px 0 color-mix(in srgb, var(--bc) 55%, #000), 0 0 0 2px var(--ink);
  transition: transform 0.08s, box-shadow 0.08s;
}
.kbtn:active .cap { transform: translateY(4px); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18), 0 1px 0 color-mix(in srgb, var(--bc) 55%, #000), 0 0 0 2px var(--ink); }
.kbtn .lb { font-size: 12px; color: var(--mute); letter-spacing: 0.06em; }
.msg { margin: 0; min-height: 1.6em; font-size: 13px; text-align: center; }
.kbd { margin: 0; font-size: 10px; color: var(--mute); }

@media (max-width: 860px) {
  .page { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "intro" "scene" "dock" "lcd"; gap: 18px; }
  .intro { align-self: start; }
  .lcdbox { align-self: center; justify-self: center; }
  .scene { height: min(112vw, 540px); }
  .wordmark { font-size: clamp(90px, 30vw, 190px); }
}
@media (prefers-reduced-motion: reduce) {
  .intro.swap .vname, .intro.swap .vsub, .intro.swap .vdesc { animation: none; }
  .chip, .kbtn .cap { transition: none; }
  :root { transition: none; }
}
